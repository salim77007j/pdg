[package]
name = "pdg-audio"
description = "PDG audio subsystem: Tempest-shaped mixer, spatializer, resampler, guest MMIO device, cpal output"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
pdg-memory.workspace = true
thiserror.workspace = true
tracing.workspace = true

[features]
# Host output stream via cpal (needs ALSA headers on Linux, WASAPI on
# Windows). Off by default so headless/CI builds stay dependency-light.
backend-cpal = ["dep:cpal"]

[dependencies.cpal]
version = "0.15"
optional = true
