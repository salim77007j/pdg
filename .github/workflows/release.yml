name: Release

# Pushing a version tag (v*) builds the release binaries on Linux and
# Windows and publishes them to the GitHub Releases page:
#   git tag v0.6.0 && git push origin v0.6.0

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: windows-latest
            platform: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        run: cargo build --release -p pdg-tools --features gui --bins

      - name: Package (Linux)
        if: matrix.platform == 'linux-x86_64'
        run: |
          mkdir -p dist
          cp target/release/pdg-boot target/release/pdg-disasm \
             target/release/pdg-wgsldump target/release/pdg-launcher dist/
          cp README.md LICENSE dist/
          tar -czf "pdg-${GITHUB_REF_NAME}-linux-x86_64.tar.gz" -C dist .
          sha256sum "pdg-${GITHUB_REF_NAME}-linux-x86_64.tar.gz" \
            > "pdg-${GITHUB_REF_NAME}-linux-x86_64.tar.gz.sha256"

      - name: Package (Windows)
        if: matrix.platform == 'windows-x86_64'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/pdg-boot.exe, target/release/pdg-disasm.exe, `
                    target/release/pdg-wgsldump.exe, target/release/pdg-launcher.exe dist/
          Copy-Item README.md, LICENSE dist/
          $zip = "pdg-${env:GITHUB_REF_NAME}-windows-x86_64.zip"
          Compress-Archive -Path dist/* -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $zip" | Out-File -Encoding ascii "$zip.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: pdg-dist-${{ matrix.platform }}
          path: |
            pdg-*.tar.gz
            pdg-*.tar.gz.sha256
            pdg-*.zip
            pdg-*.zip.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pdg-dist-*
          merge-multiple: true

      - name: List assets
        run: ls -la pdg-*

      - name: Create the release with assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            pdg-*.tar.gz
            pdg-*.tar.gz.sha256
            pdg-*.zip
            pdg-*.zip.sha256
